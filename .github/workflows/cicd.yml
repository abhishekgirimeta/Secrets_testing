
name: Test EC2 Temporary SSH Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-ec2-ssh-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  EC2_SECURITY_GROUP_ID: sg-0e61f7d982dabb8ca

jobs:
  deploy:
    name: Test Temporary SSH Access
    runs-on: ubuntu-latest

    steps:
      # 1. Configure existing IAM user credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 2. Get GitHub runner public IP
      # 3. Temporarily allow SSH from that IP
      - name: Allow temporary SSH access
        id: ssh-rule
        shell: bash
        run: |
          set -euo pipefail

          RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com | tr -d '\n')
          RUNNER_CIDR="${RUNNER_IP}/32"

          echo "GitHub Runner IP: ${RUNNER_IP}"

          EXISTING_RULE=$(aws ec2 describe-security-group-rules \
            --filters "Name=group-id,Values=${EC2_SECURITY_GROUP_ID}" \
            --query "SecurityGroupRules[?IpProtocol=='tcp' && FromPort==\`22\` && ToPort==\`22\` && CidrIpv4=='${RUNNER_CIDR}'].SecurityGroupRuleId | [0]" \
            --output text)

          if [[ "$EXISTING_RULE" != "None" && -n "$EXISTING_RULE" ]]; then
            echo "SSH rule already exists. Leaving it unchanged."
            echo "rule_id=" >> "$GITHUB_OUTPUT"
          else
            RULE_ID=$(aws ec2 authorize-security-group-ingress \
              --group-id "$EC2_SECURITY_GROUP_ID" \
              --protocol tcp \
              --port 22 \
              --cidr "$RUNNER_CIDR" \
              --query 'SecurityGroupRules[0].SecurityGroupRuleId' \
              --output text)

            echo "Created temporary SSH rule: ${RULE_ID}"
            echo "rule_id=${RULE_ID}" >> "$GITHUB_OUTPUT"
          fi

      # 4. Connect to EC2 and deploy test application
      - name: Deploy Nginx test application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "Connected to EC2 successfully"

            docker pull nginx:alpine

            docker rm -f temporary-test-app || true

            docker run -d \
              --name temporary-test-app \
              --restart unless-stopped \
              -p 8080:80 \
              nginx:alpine

            echo "Waiting for Nginx..."

            sleep 5

            curl -f http://127.0.0.1:8080

            echo "Nginx test application deployed successfully"

      # 5. Remove only the temporary rule created by this workflow
      - name: Remove temporary SSH access
        if: always() && steps.ssh-rule.outputs.rule_id != ''
        shell: bash
        run: |
          aws ec2 revoke-security-group-ingress \
            --security-group-rule-ids "${{ steps.ssh-rule.outputs.rule_id }}"

          echo "Temporary SSH rule removed"

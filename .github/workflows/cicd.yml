
name: Test EC2 Temporary SSH Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-ec2-ssh-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  EC2_SECURITY_GROUP_ID: sg-0e61f7d982dabb8ca

jobs:
  deploy:
    name: Install Docker and Deploy Nginx
    runs-on: ubuntu-latest

    steps:
      # 1. Configure existing IAM user credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 2. Temporarily allow GitHub runner IP
      - name: Allow temporary SSH access
        id: ssh-rule
        shell: bash
        run: |
          set -euo pipefail
      
          RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com | tr -d '\r\n')
          RUNNER_CIDR="${RUNNER_IP}/32"
      
          echo "GitHub Runner IP: ${RUNNER_IP}"
      
          EXISTING_RULE=$(aws ec2 describe-security-group-rules \
            --filters "Name=group-id,Values=${EC2_SECURITY_GROUP_ID}" \
            --query "SecurityGroupRules[?IpProtocol=='tcp' && FromPort==\`22\` && ToPort==\`22\` && CidrIpv4=='${RUNNER_CIDR}'].SecurityGroupRuleId | [0]" \
            --output text)
      
          if [[ -n "$EXISTING_RULE" && "$EXISTING_RULE" != "None" ]]; then
            echo "SSH rule already exists."
            echo "rule_id=" >> "$GITHUB_OUTPUT"
          else
            RULE_ID=$(aws ec2 authorize-security-group-ingress \
              --group-id "$EC2_SECURITY_GROUP_ID" \
              --protocol tcp \
              --port 22 \
              --cidr "$RUNNER_CIDR" \
              --query 'SecurityGroupRules[0].SecurityGroupRuleId' \
              --output text)
      
            echo "Created SSH rule: $RULE_ID"
            echo "rule_id=$RULE_ID" >> "$GITHUB_OUTPUT"
          fi

      # 3. SSH into EC2, install Docker and deploy Nginx
      - name: Install Docker and deploy Nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -eu

            echo "Connected to EC2 successfully"

            # Install Docker and curl if missing
            if ! command -v docker >/dev/null 2>&1 || \
               ! command -v curl >/dev/null 2>&1; then

              echo "Installing Docker and curl..."

              sudo -n apt-get update
              sudo -n apt-get install -y docker.io curl
            fi

            # Start Docker service
            echo "Starting Docker service..."

            sudo -n systemctl enable --now docker

            # Verify Docker installation
            echo "Docker version:"
            sudo docker --version

            # Pull Nginx image
            echo "Pulling Nginx image..."

            sudo docker pull nginx:alpine

            # Remove previous test container if present
            echo "Removing old test container..."

            sudo docker rm -f temporary-test-app 2>/dev/null || true

            # Run Nginx
            echo "Starting Nginx container..."

            sudo docker run -d \
              --name temporary-test-app \
              --restart unless-stopped \
              -p 8080:80 \
              nginx:alpine

            # Wait for application
            echo "Waiting for Nginx..."

            for attempt in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
                break
              fi

              sleep 2
            done

            # Verify application
            echo "Testing Nginx..."

            curl -fsS http://127.0.0.1:8080/ >/dev/null

            echo "Nginx deployed successfully!"

            sudo docker ps --filter name=temporary-test-app

      # 4. Remove temporary SSH rule
      - name: Remove temporary SSH access
        if: always() && steps.ssh-rule.outputs.rule_id != ''
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing temporary SSH rule..."

          aws ec2 revoke-security-group-ingress \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --security-group-rule-ids "${{ steps.ssh-rule.outputs.rule_id }}"

          echo "Temporary SSH rule removed successfully."
